<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="crestGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9933"/>
      <stop offset="50%" stop-color="#00B4D8"/>
      <stop offset="100%" stop-color="#0077B6"/>
    </linearGradient>
    <radialGradient id="ballGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FF5252"/>
      <stop offset="70%" stop-color="#C62828"/>
      <stop offset="100%" stop-color="#8E0000"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Outer Shield Ring -->
  <circle cx="60" cy="60" r="54" fill="#0A162B" stroke="url(#crestGrad)" stroke-width="4" filter="url(#glow)"/>
  <circle cx="60" cy="60" r="48" fill="none" stroke="#1E3A8A" stroke-dasharray="3 3" stroke-width="1.5"/>
  
  <!-- Three Wickets -->
  <rect x="47" y="32" width="4" height="42" rx="2" fill="#FFFFFF" opacity="0.95"/>
  <rect x="58" y="30" width="4" height="44" rx="2" fill="#FFFFFF" opacity="0.95"/>
  <rect x="69" y="32" width="4" height="42" rx="2" fill="#FFFFFF" opacity="0.95"/>
  <!-- Bails -->
  <rect x="45" y="30" width="14" height="3" rx="1.5" fill="#FF9933"/>
  <rect x="61" y="30" width="14" height="3" rx="1.5" fill="#FF9933"/>

  <!-- Cricket Ball with Seam -->
  <circle cx="78" cy="74" r="18" fill="url(#ballGrad)" stroke="#FFFFFF" stroke-width="1.5"/>
  <path d="M 64 68 Q 78 74 92 80" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="2 2"/>

  <!-- Stars representing international titles -->
  <polygon points="60,14 62,19 67,19 63,22 65,27 60,24 55,27 57,22 53,19 58,19" fill="#FFD700"/>
  <polygon points="38,20 40,24 44,24 41,26 42,30 38,28 34,30 35,26 32,24 36,24" fill="#FFD700"/>
  <polygon points="82,20 84,24 88,24 85,26 86,30 82,28 78,30 79,26 76,24 80,24" fill="#FFD700"/>
</svg>

